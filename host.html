<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資安百萬大挑戰 - 主持人/管理者控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-yellow-400">🏆 資安百萬大挑戰 ｜ 主持人控制台</h1>
                <p class="text-slate-400 text-sm mt-1">總獎金新台幣 100,000 元整</p>
            </div>
            <button onclick="resetGame()" class="px-4 py-2 bg-red-800 hover:bg-red-700 text-xs font-bold rounded-lg transition">重置遊戲資料</button>
        </header>

        <!-- 即時數據看板 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow">
                <h3 class="text-sm text-slate-400 mb-1">已登入總人數（已鎖定）</h3>
                <p id="total-count" class="text-4xl font-bold text-cyan-400">0</p>
            </div>
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow">
                <h3 class="text-sm text-slate-400 mb-1">當前場上存活人數</h3>
                <p id="alive-count" class="text-4xl font-bold text-green-400">0</p>
            </div>
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow flex flex-col justify-center">
                <button id="next-q-btn" onclick="nextQuestion()" class="w-full py-3 bg-green-600 hover:bg-green-500 font-bold rounded-lg transition shadow text-lg">發布下一題 / 開始出題</button>
            </div>
        </div>

        <!-- 當前題目與控制 -->
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
            <h3 class="text-lg font-bold text-yellow-300 mb-2">當前題目狀態：</h3>
            <div id="host-q-display" class="text-slate-300 text-lg mb-4">尚未開始出題，點擊按鈕後將鎖定名單並開始第一題。</div>
            <div id="timer-display" class="text-red-400 font-bold text-xl hidden">作答倒數：<span id="countdown">10</span> 秒</div>
        </div>

        <!-- 所有參加者名單牆 -->
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
            <h3 class="text-sm font-semibold text-slate-400 mb-3">全體參加者及狀態即時一覽：</h3>
            <div id="host-player-grid" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-3 bg-slate-950 rounded-lg border border-slate-800">
                <span class="text-slate-500 text-sm">尚無人登入...</span>
            </div>
        </div>

        <!-- 結算與獎金分配區 (預設隱藏) -->
        <div id="host-podium" class="hidden bg-slate-900 p-8 rounded-xl border border-yellow-500 shadow-xl text-center">
            <h2 class="text-3xl font-bold text-yellow-400 mb-2">🎉 競賽圓滿結束！最終優勝與獎金分配</h2>
            <p class="text-slate-300 mb-6">總獎金 NT$ 100,000 依表現比例分配</p>
            <div id="host-ranking-list" class="space-y-4 max-w-2xl mx-auto text-left"></div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "1. 下列哪一種密碼設定方式最不容易被駭客破解？",
                options: ["A. 自己的生日加英文名字", "B. 連續數字 12345678", "C. 大小寫英文、數字與特殊符號交錯的長密碼", "D. 公司名稱加分機號"],
                answer: 2
            },
            {
                q: "2. 同事突然透過即時通訊傳來一個未曾討論過的抽獎活動網址，您應該？",
                options: ["A. 馬上點進去搶頭香", "B. 先轉傳給其他同事一起抽", "C. 當面或電話向該同事查證是否帳號被盜", "D. 輸入個資領取獎品"],
                answer: 2
            },
            {
                q: "3. 上班時發現電腦畫面突然被上鎖，並跳出比特幣勒索畫面，第一步應？",
                options: ["A. 拍照發群組討拍", "B. 立刻拔掉網路線並通報資安人員", "C. 上網搜尋解密軟體自己處理", "D. 直接關機重開機"],
                answer: 1
            },
            {
                q: "4. 收到署名長官要求緊急匯款的 Line 訊息，最安全的處置方式是？",
                options: ["A. 依照指示立刻轉帳", "B. 先匯小額測試", "C. 透過公司內部電話或當面向長官本人求證", "D. 回傳貼圖表示收到"],
                answer: 2
            },
            {
                q: "5. 離開座位離開超過5分鐘以上，最符合資安規範的動作是？",
                options: ["A. 保持解鎖狀態方便回來做事", "B. 螢幕貼上便利貼提醒", "C. 使用快捷鍵鎖定螢幕 (Win+L)", "D. 請隔壁同事幫忙盯著"],
                answer: 2
            }
        ];

        let currentQIdx = -1;
        let timer = null;

        setInterval(updateHostDashboard, 1000);

        function updateHostDashboard() {
            const players = JSON.parse(localStorage.getItem('cyber_players') || '[]');
            const total = players.length;
            const alive = players.filter(p => p.alive).length;

            document.getElementById('total-count').innerText = total;
            document.getElementById('alive-count').innerText = alive;

            const grid = document.getElementById('host-player-grid');
            if(total === 0) {
                grid.innerHTML = '<span class="text-slate-500 text-sm">尚無人登入...</span>';
                return;
            }

            grid.innerHTML = '';
            players.forEach(p => {
                const badge = document.createElement('div');
                badge.className = `px-3 py-1 rounded-full text-xs font-bold ${p.alive ? 'bg-green-900 text-green-300 border border-green-600' : 'bg-red-900/50 text-red-400 line-through opacity-50'}`;
                badge.innerText = `${p.name} (${p.score}分)`;
                grid.appendChild(badge);
            });
        }

        function nextQuestion() {
            currentQIdx++;
            if(currentQIdx >= questions.length) {
                showFinalPodium();
                return;
            }

            const qData = questions[currentQIdx];
            document.getElementById('host-q-display').innerHTML = `<strong class="text-white">第 ${currentQIdx+1} 題：</strong> ${qData.q}<br><ul class="mt-2 text-sm text-slate-400 space-y-1">${qData.options.map((o, i) => `<li class="${i === qData.answer ? 'text-green-400 font-bold' : ''}">${o}</li>`).join('')}</ul>`;

            // 同步給參加者（此時 activeQuestion 確定 >= 0，參加者端將全面鎖定禁止新登入）
            localStorage.setItem('cyber_game_state', JSON.stringify({
                activeQuestion: currentQIdx,
                questionData: qData
            }));

            // 10秒倒數
            let timeLeft = 10;
            document.getElementById('timer-display').classList.remove('hidden');
            document.getElementById('countdown').innerText = timeLeft;
            document.getElementById('next-q-btn').disabled = true;
            document.getElementById('next-q-btn').classList.add('opacity-50', 'cursor-not-allowed');

            if(timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById('timer-display').classList.add('hidden');
                    document.getElementById('next-q-btn').disabled = false;
                    document.getElementById('next-q-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        function showFinalPodium() {
            document.getElementById('host-q-display').innerHTML = "<span class='text-green-400 font-bold'>🎉 所有題目已結束，正在結算最終排名！</span>";
            document.getElementById('next-q-btn').classList.add('hidden');
            document.getElementById('host-podium').classList.remove('hidden');
            
            let players = JSON.parse(localStorage.getItem('cyber_players') || '[]');
            players.sort((a, b) => b.score - a.score);
            const top3 = players.slice(0, 3);

            const rankingList = document.getElementById('host-ranking-list');
            rankingList.innerHTML = '';

            const prizePool = 100000;
            const ratios = [0.5, 0.3, 0.2]; // 5萬, 3萬, 2萬
            const medals = ["🥇 冠軍", "🥈 亞軍", "🥉 季軍"];

            top3.forEach((p, idx) => {
                const amount = prizePool * ratios[idx];
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-4 bg-slate-950 rounded-lg border border-slate-800";
                div.innerHTML = `
                    <div>
                        <span class="text-xl font-bold text-yellow-400 mr-3">${medals[idx]}</span>
                        <span class="text-lg font-semibold">${p.name}</span>
                        <span class="text-xs text-slate-400 block mt-1">總得分：${p.score} 分</span>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-bold text-green-400">NT$ ${amount.toLocaleString()}</span>
                        <span class="text-xs text-slate-400 block">獎金佔比 ${(ratios[idx]*100)}%</span>
                    </div>
                `;
                rankingList.appendChild(div);
            });
        }

        function resetGame() {
            if(confirm('確定要重置所有參加者與遊戲進度嗎？')) {
                localStorage.removeItem('cyber_players');
                localStorage.removeItem('cyber_game_state');
                location.reload();
            }
        }
    </script>
</body>
</html>
